<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLolli</title>
    <!-- D3.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <!-- PptxGenJS for PowerPoint Export -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        :root {
            /* Grayscale/White UI Theme */
            --bg: #ffffff;
            --card: #ffffff;
            --text: #000000;
            --accent: #28509C;
            --border: #e0e0e0;
            --console-bg: #1c1c1e;
            --console-text: #00ff00;
            
            /* Data Palette Colors (for UI reference only, JS uses hex directly) */
            --p1: #28509C; /* Benign */
            --p2: #ED037C; /* Pathogenic */
            --p3: #272D72;
            --p4: #A9208E; /* VUS */
            --p5: #7C2F90;
            --p6: #000000;
            --p7: #A0A0A0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1400px; }

        header { margin-bottom: 1.5rem; text-align: left; display: flex; justify-content: space-between; align-items: flex-end; }
        
        .search-area {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-start;
            border: 1px solid var(--border);
        }

        .search-input-group {
            display: flex;
            gap: 15px;
            flex-grow: 1;
            align-items: flex-start;
        }

        .input-item { display: flex; flex-direction: column; gap: 4px; }
        .input-item label { font-size: 11px; font-weight: 600; color: #86868b; }

        input[type="text"], select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            font-family: Arial, sans-serif;
            transition: border-color 0.2s;
            background: white;
        }

        /* Multiselect specific styling */
        .multiselect-filter {
            height: 75px !important;
            padding: 4px !important;
            min-width: 150px;
            max-width: 200px;
        }
        .multiselect-filter option {
            padding: 4px 8px;
            margin-bottom: 2px;
            border-radius: 4px;
        }

        .slider-group { min-width: 180px; }

        button {
            padding: 10px 20px;
            background: var(--text);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: Arial, sans-serif;
            transition: opacity 0.2s;
            align-self: flex-end;
            margin-bottom: 2px;
        }

        button:hover { opacity: 0.85; }
        button.secondary { background: #f2f2f7; color: var(--text); border: 1px solid var(--border); }

        /* Main Plot Layout */
        .viz-main-layout {
            display: flex;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 1px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            overflow: hidden;
            height: 600px;
            position: relative;
        }

        #legend-area {
            width: 280px;
            flex-shrink: 0;
            background: #fafafa;
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            font-size: 11px;
            transition: width 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
        }

        #legend-area.collapsed { width: 0; padding: 0; border: none; opacity: 0; pointer-events: none; }

        .legend-toggle-btn {
            position: absolute;
            left: 280px;
            top: 10px;
            z-index: 10;
            background: white;
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 8px 8px 0;
            padding: 6px 10px;
            cursor: pointer;
            transition: left 0.3s ease;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #86868b;
        }

        #legend-area.collapsed + .legend-toggle-btn { left: 0; }

        .viz-wrapper { flex-grow: 1; position: relative; overflow: hidden; background: white; }
        #viz-container { width: 100%; height: 100%; cursor: move; }

        .legend-section { display: flex; flex-direction: column; gap: 6px; }
        .legend-title { font-weight: 700; color: #86868b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .legend-item { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.2s, opacity 0.2s; user-select: none; }
        .legend-item:hover { background: rgba(0,0,0,0.05); }
        .legend-item.hidden { opacity: 0.3; text-decoration: line-through; }
        .swatch-circle { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        .swatch-rect { width: 20px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.1); }
        .swatch-shape { width: 12px; height: 12px; display: flex; align-items: center; justify-content: center; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 12px; font-size: 12px; border: 1px solid var(--border); width: 100%; box-sizing: border-box; }
        .control-item { display: flex; flex-direction: column; gap: 4px; }
        .feature-selector { display: flex; flex-wrap: wrap; gap: 8px; padding: 5px; border: 1px dashed var(--border); border-radius: 8px; max-height: 80px; overflow-y: auto; }
        .feature-checkbox { display: flex; align-items: center; gap: 4px; font-size: 10px; background: #fff; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }

        .console-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
        .console-panel { background: var(--console-bg); border-radius: 12px; color: var(--console-text); font-family: Arial, sans-serif; height: 300px; display: flex; flex-direction: column; overflow: hidden; }
        .console-header { background: #2c2c2e; padding: 8px 15px; font-size: 11px; text-transform: uppercase; color: #aeaeae; display: flex; justify-content: space-between; }
        #api-log { padding: 10px; overflow-y: auto; font-size: 12px; flex-grow: 1; white-space: pre-wrap; font-family: monospace; }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #3a3a3c; padding-bottom: 4px; }
        .inspector-split { display: flex; height: 100%; flex-grow: 1; }
        .inspector-sidebar { width: 150px; border-right: 1px solid #3a3a3c; padding: 10px; overflow-y: auto; }
        .var-link { display: block; padding: 6px; cursor: pointer; font-size: 11px; color: #aeaeae; border-radius: 4px; }
        .var-link.active { background: var(--accent); color: white; }
        .inspector-window { flex-grow: 1; padding: 10px; overflow-y: auto; font-size: 12px; font-family: monospace; }

        .tooltip { position: absolute; padding: 10px; background: rgba(0, 0, 0, 0.95); color: white; border-radius: 8px; font-size: 12px; pointer-events: none; visibility: hidden; z-index: 200; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); line-height: 1.4; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 30px; border-radius: 20px; max-width: 900px; width: 95%; max-height: 85vh; overflow-y: auto; position: relative; }
        .detail-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 13px; }
        .detail-table th, .detail-table td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
        .raw-json-block { background: #f8f8f8; padding: 15px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 11px; overflow-x: auto; border: 1px solid var(--border); margin-top: 15px; color: #333; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; text-transform: uppercase; font-weight: 700; color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-weight: 800; letter-spacing: -0.02em;">Quick <span style="color:var(--text)">Lolli</span></h1>
            <p style="margin: 4px 0 0 0; color: #86868b;">Advanced Lollipop Plotter with Sidestacked Legend</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="secondary" onclick="exportPNG()">Export PNG</button>
            <button class="secondary" onclick="exportPPTX()">Export PPTX</button>
            <button class="secondary" onclick="exportSVG()">Export SVG</button>
            <button class="secondary" onclick="resetZoom()">Reset Zoom</button>
        </div>
    </header>

    <div class="search-area">
        <div class="search-input-group">
            <div class="input-item" style="flex-grow: 1;">
                <label>Gene Symbol</label>
                <input type="text" id="geneSearch" placeholder="e.g., FGFR3, TP53..." value="FGFR3">
            </div>
            <div class="input-item slider-group">
                <label>Max Results: <span id="maxVal">1000</span></label>
                <input type="range" id="sizeSlider" min="1" max="1000" value="1000" oninput="document.getElementById('maxVal').innerText = this.value">
            </div>
        </div>
        <button id="fetchBtn" onclick="loadGeneData()">Fetch Data</button>
    </div>

    <div class="viz-main-layout">
        <div id="legend-area">
            <span style="color:#86868b">Search for a gene to view the legend.</span>
        </div>
        <button class="legend-toggle-btn" id="legendToggle" onclick="toggleLegend()">
            <svg id="toggleIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.3s ease;"><path d="M15 18l-6-6 6-6"/></svg>
            <span>LEGEND</span>
        </button>
        <div class="viz-wrapper" id="viz-wrapper">
            <div id="viz-container"></div>
            <div id="tooltip" class="tooltip"></div>
        </div>
    </div>

    <div class="toolbar">
        <div class="control-item">
            <label>Color (Grouping)</label>
            <select id="colorMode" onchange="render()">
                <option value="clinvar">ClinVar Status (Latest)</option>
                <option value="condition">Primary Condition</option>
                <option value="type">Variant Type (Top 4)</option>
            </select>
        </div>
        <div class="control-item">
            <label>Variant Effect (Ctrl+Click)</label>
            <select id="effectFilter" class="multiselect-filter" multiple size="4" onchange="render()"></select>
        </div>
        <div class="control-item">
            <label>Significance (Ctrl+Click)</label>
            <select id="sigFilter" class="multiselect-filter" multiple size="4" onchange="render()"></select>
        </div>
        <div class="control-item">
            <label>Condition (Ctrl+Click)</label>
            <select id="condFilter" class="multiselect-filter" multiple size="4" onchange="render()"></select>
        </div>
        <div class="control-item">
            <label>Actions</label>
            <button class="secondary" onclick="clearFilters()" style="margin-top: auto; margin-bottom: 2px;">Clear Filters</button>
        </div>
        <div class="control-item">
            <label>Variant Options</label>
            <div style="display:flex; flex-direction: column; gap: 6px; margin-top: 4px; font-size: 11px;">
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <span style="font-weight:bold; color:#86868b;">Labels (HGVS)</span>
                    <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                        <input type="radio" name="labelMode" value="none" checked onchange="toggleLabelSlider(); render();"> None
                    </label>
                    <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                        <input type="radio" name="labelMode" value="all" onchange="toggleLabelSlider(); render();"> Show All
                    </label>
                    <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                        <input type="radio" name="labelMode" value="top" onchange="toggleLabelSlider(); render();"> Show Top N
                    </label>
                    <div id="topNContainer" style="display:none; flex-direction:column; gap:2px; margin-left: 18px;">
                        <span>Top <span id="topNValDisplay">10</span></span>
                        <input type="range" id="topNLabels" min="1" max="50" value="10" oninput="document.getElementById('topNValDisplay').innerText = this.value; render();" style="width: 100px;">
                    </div>
                </div>
                <input type="text" id="highlightFilter" placeholder="Highlight: Sig, Type..." oninput="render()" style="padding: 4px; font-size: 11px; margin-top: 4px;">
            </div>
        </div>
        <div class="control-item">
            <label>Lollipop Height</label>
            <select id="heightMode" onchange="render()">
                <option value="freq">Submissions</option>
                <option value="fixed">Uniform</option>
            </select>
        </div>
        <div class="control-item">
            <label>Base Scale</label>
            <input type="range" id="yScale" min="50" max="400" value="200" oninput="render()">
        </div>
        <div class="control-item">
            <label>Backbone Options</label>
            <div style="display:flex; flex-direction: column; gap: 8px; margin-top: 4px;">
                <label style="display:flex; align-items:center; gap:4px; font-size:11px; font-weight:normal; cursor:pointer;">
                    <input type="checkbox" id="showExonLabels" onchange="render()"> Show Exon Labels
                </label>
                <button class="secondary" onclick="clearBackboneFeatures()" style="margin:0; padding:4px 8px; font-size:10px; align-self: flex-start;">Clear All Features</button>
            </div>
        </div>
        <div class="control-item">
            <label>Backbone Color</label>
            <input type="color" id="backboneColor" value="#e8e8ed" oninput="render()">
        </div>
        <div class="control-item" style="max-width: 250px;">
            <label>Backbone Features</label>
            <div id="feature-list" class="feature-selector">
                <span style="color:#86868b; padding:5px">No features loaded...</span>
            </div>
        </div>
    </div>

    <div class="console-section">
        <div class="console-panel">
            <div class="console-header"><span>API Activity Log</span><span onclick="clearLogs()" style="cursor:pointer">Clear</span></div>
            <div id="api-log"></div>
        </div>
        <div class="console-panel">
            <div class="console-header">Live Variable Inspector</div>
            <div class="inspector-split">
                <div class="inspector-sidebar" id="var-sidebar">
                    <span class="var-link" onclick="inspectVar('rawData')">rawData</span>
                    <span class="var-link" onclick="inspectVar('geneInfo')">geneInfo</span>
                    <span class="var-link" onclick="inspectVar('hiddenCategories')">hiddenCategories</span>
                    <span class="var-link" onclick="inspectVar('shapeMap')">shapeMap</span>
                </div>
                <div class="inspector-window" id="inspector-output">Click a variable to inspect current value...</div>
            </div>
        </div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <h2 id="modalTitle" style="margin-top:0">Variant Details</h2>
        <div id="modalContent"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="secondary" id="exportBtn">Export JSON</button>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<script>
    /** --- POSITIONING & STYLE VARIABLES --- **/
    const PLOT_VERTICAL_OFFSET_RATIO = 0.72; 
    const LOLLIPOP_HEAD_SIZE = 80;
    const BACKBONE_HEIGHT = 20;
    const BACKBONE_STROKE_COLOR = "#000000";
    const BACKBONE_STROKE_WIDTH = 2;
    const CALLOUT_STAGGER_HEIGHT = 20;
    const CALLOUT_FONT_SIZE = "12px";
    const EXON_GAP_SIZE = 2;

    // Requested Hex Palette for Data Points (No Vars)
    const PALETTE_COLORS = {
        p1: "#28509C", // Benign / Type 1
        p2: "#ED037C", // Pathogenic / Type 2
        p3: "#272D72", // Type 3
        p4: "#A9208E", // VUS / Type 4
        p5: "#7C2F90", 
        p6: "#000000",
        p7: "#A0A0A0"  // Unknown
    };
    const CUSTOM_PALETTE_ARRAY = Object.values(PALETTE_COLORS);

    let rawData = [];
    let geneInfo = { length: 1000, features: [], exons: [], canonicalTranscript: "N/A" };
    let zoomTransform = d3.zoomIdentity;
    let selectedFeatureTypes = new Set(['DOMAIN', 'TRANSMEM']);
    let shapeMap = {};
    let hiddenCategories = new Set();
    let conditionColorScale = d3.scaleOrdinal(CUSTOM_PALETTE_ARRAY);

    const availableSymbols = [
        d3.symbolCircle, d3.symbolTriangle, d3.symbolSquare, 
        d3.symbolDiamond, d3.symbolCross, d3.symbolStar, d3.symbolWye
    ];

    /** --- LAYOUT LOGIC --- **/
    function toggleLegend(forceCollapse) {
        const area = document.getElementById('legend-area');
        const icon = document.getElementById('toggleIcon');
        const isCurrentlyCollapsed = area.classList.contains('collapsed');
        const targetCollapse = (forceCollapse !== undefined) ? forceCollapse : !isCurrentlyCollapsed;
        area.classList.toggle('collapsed', targetCollapse);
        icon.style.transform = targetCollapse ? 'rotate(180deg)' : 'rotate(0deg)';
        setTimeout(render, 310);
    }

    const mediaQuery = window.matchMedia("(max-width: 1000px)");
    function handleScreenResize(e) { toggleLegend(e.matches ? true : false); }
    mediaQuery.addListener(handleScreenResize);
    
    function toggleLabelSlider() {
        const mode = document.querySelector('input[name="labelMode"]:checked')?.value;
        const container = document.getElementById('topNContainer');
        if (container) container.style.display = mode === 'top' ? 'flex' : 'none';
    }

    function updateLegend(dataForLegend = rawData) {
        const legendArea = d3.select("#legend-area");
        legendArea.selectAll("*").remove();
        if (rawData.length === 0) { legendArea.html('<span style="color:#86868b">Search for a gene to view the legend.</span>'); return; }
        if (dataForLegend.length === 0) { legendArea.html('<span style="color:#86868b">No variants match the current filters.</span>'); return; }

        const colorMode = document.getElementById('colorMode')?.value || 'clinvar';
        const currentTypes = new Set(dataForLegend.map(d => d.type));
        const currentConds = new Set(dataForLegend.map(d => d.primaryCondition));

        // 1. Shapes
        const shapeSection = legendArea.append("div").attr("class", "legend-section");
        shapeSection.append("div").attr("class", "legend-title").text("Variant Effect");
        Object.keys(shapeMap).forEach(type => {
            if (!currentTypes.has(type)) return;
            const isHidden = hiddenCategories.has(type);
            const item = shapeSection.append("div")
                .attr("class", `legend-item ${isHidden ? 'hidden' : ''}`)
                .on("click", () => toggleCategory(type))
                .on("dblclick", () => soloCategory(type, 'type'));
            const svg = item.append("div").attr("class", "swatch-shape").append("svg").attr("width", 14).attr("height", 14).append("g").attr("transform", "translate(7,7)");
            svg.append("path").attr("d", d3.symbol().type(shapeMap[type]).size(40)).attr("fill", "#636366");
            item.append("span").text(type.charAt(0).toUpperCase() + type.slice(1));
        });

        // 2. Colors
        const colorSection = legendArea.append("div").attr("class", "legend-section");
        colorSection.append("div").attr("class", "legend-title").text(colorMode === 'clinvar' ? "Significance" : (colorMode === 'type' ? "Classification" : "Primary Condition"));
        
        if (colorMode === 'clinvar') {
            [{ l: 'Pathogenic', c: PALETTE_COLORS.p2 }, { l: 'Benign', c: PALETTE_COLORS.p1 }, { l: 'VUS', c: PALETTE_COLORS.p4 }, { l: 'Unknown', c: '#8e8e93' }].forEach(s => {
                const item = colorSection.append("div").attr("class", "legend-item");
                item.append("div").attr("class", "swatch-circle").style("background", s.c);
                item.append("span").text(s.l);
            });
        } else if (colorMode === 'type') {
            const types = Object.keys(shapeMap);
            const paletteScale = d3.scaleOrdinal(CUSTOM_PALETTE_ARRAY).domain(Object.keys(shapeMap));
            types.forEach(t => {
                if (!currentTypes.has(t)) return;
                const isHidden = hiddenCategories.has(t);
                const item = colorSection.append("div").attr("class", `legend-item ${isHidden ? 'hidden' : ''}`)
                    .on("click", () => toggleCategory(t))
                    .on("dblclick", () => soloCategory(t, 'type'));
                item.append("div").attr("class", "swatch-circle").style("background", paletteScale(t));
                item.append("span").text(t.charAt(0).toUpperCase() + t.slice(1));
            });
        } else {
            const conditions = [...new Set(rawData.map(d => d.primaryCondition))];
            conditions.forEach(c => {
                if (!currentConds.has(c)) return;
                const isHidden = hiddenCategories.has(c);
                const item = colorSection.append("div")
                    .attr("class", `legend-item ${isHidden ? 'hidden' : ''}`)
                    .on("click", () => toggleCategory(c))
                    .on("dblclick", () => soloCategory(c, 'condition'));
                item.append("div").attr("class", "swatch-circle").style("background", c === 'Multiple' ? '#9467bd' : (c === 'Unknown' ? '#8e8e93' : conditionColorScale(c)));
                item.append("span").text(c);
            });
        }

        if (selectedFeatureTypes.size > 0) {
            const bbSection = legendArea.append("div").attr("class", "legend-section");
            bbSection.append("div").attr("class", "legend-title").text("Backbone Features");
            const palette = d3.scaleOrdinal(d3.schemeSet3);
            Array.from(selectedFeatureTypes).forEach(type => {
                const item = bbSection.append("div").attr("class", "legend-item");
                item.append("div").attr("class", "swatch-rect").style("background", palette(type));
                item.append("span").text(type);
            });
        }
    }

    function toggleCategory(cat) {
        if (hiddenCategories.has(cat)) hiddenCategories.delete(cat);
        else hiddenCategories.add(cat);
        render();
    }

    function soloCategory(cat, source) {
        let allPossible = [];
        if (source === 'type') allPossible = Object.keys(shapeMap);
        else allPossible = [...new Set(rawData.map(d => d.primaryCondition))];
        const others = allPossible.filter(c => c !== cat);
        const isCurrentlySolo = others.every(c => hiddenCategories.has(c)) && !hiddenCategories.has(cat);
        if (isCurrentlySolo) hiddenCategories.clear();
        else { hiddenCategories.clear(); others.forEach(c => hiddenCategories.add(c)); }
        render();
    }

    function clearFilters() {
        ['effectFilter', 'sigFilter', 'condFilter'].forEach(id => {
            const el = document.getElementById(id);
            if (el) Array.from(el.options).forEach(o => o.selected = true);
        });
        const hf = document.getElementById('highlightFilter');
        if (hf) hf.value = '';
        hiddenCategories.clear();
        render();
    }
    
    function clearBackboneFeatures() {
        selectedFeatureTypes.clear();
        document.querySelectorAll('.feature-checkbox input').forEach(cb => cb.checked = false);
        render();
    }

    function logAPI(url, status, response) {
        const log = document.getElementById('api-log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const timestamp = new Date().toLocaleTimeString();
        entry.innerHTML = `<span style="color:#636366">[${timestamp}]</span> <span class="log-status">${status}</span> <span class="log-url">${url.split('?')[0]}</span><div style="margin-top:4px; color:#aeaeae; font-size:10px">${JSON.stringify(response).substring(0, 150)}...</div>`;
        log.prepend(entry);
    }

    function clearLogs() { document.getElementById('api-log').innerHTML = ''; }

    function inspectVar(varName) {
        document.querySelectorAll('.var-link').forEach(l => l.classList.toggle('active', l.innerText === varName));
        const output = document.getElementById('inspector-output');
        try {
            const val = eval(varName);
            output.innerHTML = `<pre>${JSON.stringify(val, (k, v) => v instanceof Set ? Array.from(v) : (typeof v === 'function' ? '[Function]' : v), 2)}</pre>`;
        } catch(e) { output.innerText = "Error: " + e.message; }
    }

    const zoom = d3.zoom().scaleExtent([0.5, 50]).on("zoom", (event) => { 
        zoomTransform = event.transform; 
        render(); 
    });

    function escapeQueryValue(v) { return v.replace(/[\s():"']/g, m => `\\${m}`); }

    async function fetchUniprotCanonicalHumanFeatures(symbol) {
        const query = `(gene_exact:${escapeQueryValue(symbol)} OR gene:${escapeQueryValue(symbol)}) AND organism_id:9606 AND reviewed:true`;
        const searchUrl = `https://rest.uniprot.org/uniprotkb/search?query=${encodeURIComponent(query)}&format=json&size=5&fields=accession,id,gene_primary,length,protein_existence`;
        const searchResp = await fetch(searchUrl);
        const searchJson = await searchResp.json();
        logAPI(searchUrl, searchResp.status, searchJson);
        if (!searchJson.results?.length) return null;
        const entry = searchJson.results[0]; 
        const accession = entry.primaryAccession || entry.accession;
        const entryUrl = `https://rest.uniprot.org/uniprotkb/${encodeURIComponent(accession)}?format=json`;
        const entryResp = await fetch(entryUrl);
        const fullEntry = await entryResp.json();
        logAPI(entryUrl, entryResp.status, fullEntry);
        return {
            length: fullEntry.sequence?.length || 1000,
            features: (fullEntry.features || []).map(f => ({
                type: f.type, description: f.description, begin: f.location?.start?.value, end: f.location?.end?.value
            }))
        };
    }

    function findExons(features) {
        let exons = [];
        function recurse(obj) {
            if (Array.isArray(obj)) { obj.forEach(recurse); }
            else if (obj && typeof obj === 'object') {
                if (obj.type === 'exon') exons.push(obj);
                if (obj.features) recurse(obj.features);
            }
        }
        recurse(features);
        return exons;
    }

    function updateFeatureControls() {
        const container = document.getElementById('feature-list');
        if (!container) return;
        container.innerHTML = '';
        const uniqueTypes = [...new Set(geneInfo.features.map(f => f.type))].sort();
        uniqueTypes.forEach(type => {
            const label = document.createElement('label'); label.className = 'feature-checkbox';
            const isDefault = type.toUpperCase().includes('DOMAIN') || type.toUpperCase().includes('TRANSMEM');
            if (isDefault) selectedFeatureTypes.add(type);
            label.innerHTML = `<input type="checkbox" value="${type}" ${selectedFeatureTypes.has(type) ? 'checked' : ''} onchange="toggleFeatureType(this)"> ${type}`;
            container.appendChild(label);
        });
    }

    async function loadGeneData() {
        const gene = document.getElementById('geneSearch')?.value.trim().toUpperCase() || 'FGFR3';
        const size = document.getElementById('sizeSlider')?.value || 500;
        const btn = document.getElementById('fetchBtn'); 
        if (btn) { btn.innerText = "Loading..."; btn.disabled = true; }

        try {
            const uniprot = await fetchUniprotCanonicalHumanFeatures(gene);
            const varUrl = `https://myvariant.info/v1/query?q=clinvar.gene.symbol:${gene}+AND+_exists_:clinvar&fields=clinvar,snpeff&size=${size}`;
            const varRes = await fetch(varUrl);
            const vJson = await varRes.json();
            logAPI(varUrl, varRes.status, vJson);
            if(!vJson.hits?.length) throw new Error("No variants found.");

            let detectedTranscript = "N/A";
            vJson.hits.some(h => {
                const cv = h.clinvar || {};
                const rcvs = Array.isArray(cv.rcv) ? cv.rcv : (cv.rcv ? [cv.rcv] : []);
                const hgvsP = rcvs[0]?.preferred_name || h.snpeff?.ann?.[0]?.hgvs_p || "";
                if (hgvsP.startsWith("NM_")) {
                    detectedTranscript = hgvsP.split('(')[0];
                    return true;
                }
                return false;
            });

            let exonSegments = [];
            if (detectedTranscript !== "N/A") {
                const mutUrl = `https://mutalyzer.nl/api/reference_model/?reference_id=${detectedTranscript}&siblings=false&ancestors=true&descendants=true`;
                const mutRes = await fetch(mutUrl);
                const mutData = await mutRes.json();
                logAPI(mutUrl, mutRes.status, mutData);
                const exonFeatures = findExons(mutData.annotations?.features || []);
                exonSegments = exonFeatures.map(e => ({
                    id: e.id || e.name || "exon",
                    start_nt: (e.location?.start?.position || 0),
                    end_nt: (e.location?.end?.position || 0),
                    start: (e.location?.start?.position || 0) / 3,
                    end: (e.location?.end?.position || 0) / 3
                })).sort((a, b) => a.start - b.start);
            }

            if(uniprot) { 
                geneInfo = { ...uniprot, exons: exonSegments, canonicalTranscript: detectedTranscript }; 
                updateFeatureControls(); 
            }

            // Top 4 Logic
            let typeCountsFull = {};
            vJson.hits.forEach(h => {
                const nmMatch = (h.clinvar?.hgvs?.nucleotide || "").match(/NM_\d+/);
                const targetNM = nmMatch ? nmMatch[0] : (detectedTranscript !== "N/A" ? detectedTranscript : null);
                let annList = Array.isArray(h.snpeff?.ann) ? h.snpeff.ann : (h.snpeff?.ann ? [h.snpeff.ann] : []);
                let bestAnn = annList.find(ann => targetNM && ann.feature_id?.includes(targetNM)) || annList.find(ann => ann.effect);
                const rawEffect = (bestAnn?.effect || "other").toLowerCase();
                const type = rawEffect.split('_')[0];
                typeCountsFull[type] = (typeCountsFull[type] || 0) + 1;
            });
            const top4Types = Object.entries(typeCountsFull).sort((a, b) => b[1] - a[1]).slice(0, 4).map(e => e[0]);

            shapeMap = {};
            hiddenCategories.clear();
            let uniqueTypesFound = new Set();
            const garbage = ['not provided', 'not specified', 'not available', 'none', 'unknown', '-', 'unspecified'];

            rawData = vJson.hits.map(h => {
                const cv = h.clinvar || {};
                const rcvs = Array.isArray(cv.rcv) ? [...cv.rcv] : (cv.rcv ? [cv.rcv] : []);
                rcvs.sort((a, b) => (new Date(b.last_evaluated || 0)) - (new Date(a.last_evaluated || 0)));

                const nmMatch = (cv.hgvs?.nucleotide || "").match(/NM_\d+/);
                const targetNM = nmMatch ? nmMatch[0] : (detectedTranscript !== "N/A" ? detectedTranscript : null);

                let annList = Array.isArray(h.snpeff?.ann) ? h.snpeff.ann : (h.snpeff?.ann ? [h.snpeff.ann] : []);
                let bestAnn = annList.find(ann => targetNM && ann.feature_id?.includes(targetNM));
                if (!bestAnn) bestAnn = annList.find(ann => ann.effect);
                
                const firstWord = (bestAnn?.effect || "other").toLowerCase().split('_')[0];
                let type = top4Types.includes(firstWord) ? firstWord : "other";

                const hgvsP = rcvs[0]?.preferred_name ?? bestAnn?.hgvs_p ?? "N/A";

                // Second pass effect determination for "other" types
                if (type === "other") {
                    if (hgvsP.includes('fs')) {
                        type = "frameshift";
                    } else if (hgvsP.endsWith('Ter') || hgvsP.endsWith('Ter)')) {
                        type = "stop_gain";
                    } else if (hgvsP.includes('ext')) {
                        type = "stop_loss";
                    }
                }

                uniqueTypesFound.add(type);

                const condCounts = {};

                rcvs.forEach(r => {
                    if (!r?.conditions) return;

                    // Normalize conditions to always be an array
                    const conditions = Array.isArray(r.conditions)
                        ? r.conditions
                        : [r.conditions];

                    conditions.forEach(cond => {
                        const cRaw = cond?.name || "";
                        const name = cRaw.toLowerCase().trim();

                        if (name && !garbage.some(g => name.includes(g))) {
                            condCounts[cRaw] = (condCounts[cRaw] || 0) + 1;
                        }
                    });
                });


                const sortedConds = Object.entries(condCounts).sort((a, b) => b[1] - a[1]);
                let primaryCondition = 'Unknown';
                if (sortedConds.length > 0) {
                    const totalCountForVariant = Object.values(condCounts).reduce((a, b) => a + b, 0);
                    const topFreq = sortedConds[0][1] / totalCountForVariant;
                    const secondFreq = sortedConds[1] ? sortedConds[1][1] / totalCountForVariant : 0;
                    if ((topFreq - secondFreq) > 0.1) primaryCondition = sortedConds[0][0];
                    else primaryCondition = 'Multiple';
                }

                const posMatch = hgvsP.match(/p\.[A-Za-z]+(\d+)/) || hgvsP.match(/\d+/);
                const pos = posMatch ? parseInt(posMatch[1] || posMatch[0]) : Math.floor(Math.random() * geneInfo.length);

                return {
                    id: h._id, variant_id: cv.variation_id || cv.variant_id || null, pos, hgvs_p: hgvsP, hgvs_g: h._id,
                    submissions: rcvs.length || 1,
                    significance: rcvs[0]?.clinical_significance ?? "Unknown",
                    type, raw: h,
                    primaryCondition,
                    condCounts,
                    allConditions: Object.keys(condCounts).join(", ") || "Not provided"
                };
            });

            Array.from(uniqueTypesFound).sort().forEach((t, i) => { shapeMap[t] = availableSymbols[i % availableSymbols.length]; });

            // POPULATE DROPDOWNS
            const populateSelect = (id, key) => {
                const select = document.getElementById(id);
                if (!select) return;
                select.innerHTML = ``; // Clear existing
                const uniqueVals = [...new Set(rawData.map(d => d[key]))].sort();
                uniqueVals.forEach(v => {
                    const label = v.length > 25 ? v.substring(0,25) + '...' : v;
                    const safeV = v.replace(/"/g, '&quot;');
                    // Pre-select all by default so variants show initially
                    select.innerHTML += `<option value="${safeV}" selected>${label}</option>`;
                });
            };
            populateSelect('effectFilter', 'type');
            populateSelect('sigFilter', 'significance');
            populateSelect('condFilter', 'primaryCondition');

            // Set conditionColorScale domain to make colors stable
            conditionColorScale.domain([...new Set(rawData.map(d => d.primaryCondition))].sort());

            d3.select("#viz-container").call(zoom);
            render();
        } catch (e) { alert("Error: " + e.message); }
        finally { if (btn) { btn.innerText = "Fetch Data"; btn.disabled = false; } }
    }

    function render() {
        const container = d3.select("#viz-container");
        if (container.empty()) return;
        container.selectAll("*").remove();
        
        const rect = container.node().getBoundingClientRect();
        const width = rect.width, height = rect.height, margin = { top: 0, right: 30, bottom: 0, left: 30 };
        const svg = container.append("svg").attr("width", width).attr("height", height);
        
        const g = svg.append("g")
            .attr("transform", `translate(${zoomTransform.x + margin.left}, ${zoomTransform.y + height * PLOT_VERTICAL_OFFSET_RATIO})`);

        const xScale = d3.scaleLinear().domain([0, geneInfo.length]).range([0, width - margin.left - margin.right]);
        const rescaledX = zoomTransform.rescaleX(xScale);
        const colorMode = document.getElementById('colorMode')?.value || 'clinvar';
        const heightMode = document.getElementById('heightMode')?.value || 'freq';
        const searchInput = document.getElementById('highlightFilter')?.value.toLowerCase() || '';
        const searching = searchInput.length > 3;
        const bbColor = document.getElementById('backboneColor')?.value || '#e8e8ed';
        const maxHeightVal = +document.getElementById('yScale')?.value || 200;
        
        const labelMode = document.querySelector('input[name="labelMode"]:checked')?.value || 'none';
        const topN = parseInt(document.getElementById('topNLabels')?.value || 10);

        const getSelectedValues = id => {
            const el = document.getElementById(id);
            return el ? Array.from(el.selectedOptions).map(o => o.value) : [];
        };
        const effectFilter = getSelectedValues('effectFilter');
        const sigFilter = getSelectedValues('sigFilter');
        const condFilter = getSelectedValues('condFilter');

        const baseFilteredData = rawData.filter(d => {
            if (!effectFilter.includes(d.type)) return false;
            if (!sigFilter.includes(d.significance)) return false;
            if (!condFilter.includes(d.primaryCondition)) return false;
            return true;
        });

        const visible = baseFilteredData.filter(d => {
            if (colorMode === 'condition') return !hiddenCategories.has(d.primaryCondition);
            return !hiddenCategories.has(d.type);
        });

        // Determine Top N variants for labels
        let topNVariantObjs = new Set();
        if (labelMode === 'top') {
            const getSigRank = (sig) => {
                const s = (sig || '').toLowerCase();
                if (s === 'pathogenic' || (s.includes('pathogenic') && !s.includes('likely'))) return 6;
                if (s.includes('likely pathogenic')) return 5;
                if (s.includes('uncertain') || s === 'vus') return 4;
                if (s.includes('conflicting')) return 3;
                if (s.includes('likely benign')) return 2;
                if (s === 'benign' || (s.includes('benign') && !s.includes('likely'))) return 1;
                return 0;
            };
            const sortedVisible = [...visible].sort((a, b) => {
                if (b.submissions !== a.submissions) return b.submissions - a.submissions;
                return getSigRank(b.significance) - getSigRank(a.significance);
            });
            topNVariantObjs = new Set(sortedVisible.slice(0, topN));
        }

        // Dynamic Title
        const geneSymbolText = (document.getElementById('geneSearch')?.value || "FGFR3").toUpperCase();
        const transcriptText = `[${geneInfo.canonicalTranscript}]`;
        const titleText = svg.append("text").attr("x", width / 2).attr("y", 25).attr("text-anchor", "middle").attr("font-weight", "800").attr("fill", "var(--text)");
        titleText.append("tspan").attr("x", width / 2).attr("font-size", width < 600 ? "14px" : "20px").text(geneSymbolText);
        titleText.append("tspan").attr("x", width / 2).attr("dy", "1.2em").attr("font-size", width < 600 ? "10px" : "14px").attr("font-weight", "600").attr("fill", "#86868b").text(transcriptText);

        const yScale = d3.scaleLinear().domain([0, d3.max(baseFilteredData, d => d.submissions) || 1]).range([0, -maxHeightVal]);
        const centerY = 0; 

        // Fragmented Backbone
        if (geneInfo.exons.length > 0) {
            geneInfo.exons.forEach((s, i) => {
                g.append("rect")
                    .attr("x", rescaledX(s.start)).attr("y", centerY - (BACKBONE_HEIGHT / 2))
                    .attr("width", Math.max(1, rescaledX(s.end) - rescaledX(s.start) - EXON_GAP_SIZE))
                    .attr("height", BACKBONE_HEIGHT).attr("rx", 2)
                    .attr("fill", bbColor).attr("fill-opacity", 0.6)
                    .attr("stroke", BACKBONE_STROKE_COLOR).attr("stroke-width", BACKBONE_STROKE_WIDTH)
                    .on("mouseover", (e) => showExonTooltip(e, s)).on("mousemove", moveTooltip).on("mouseout", hideTooltip);
                
                // Exon Label Overlay (Toggleable)
                if (document.getElementById('showExonLabels')?.checked) {
                    g.append("text")
                        .attr("x", rescaledX((s.start + s.end) / 2))
                        .attr("y", centerY + 4) // Center vertically inside the 20px segment
                        .attr("text-anchor", "middle")
                        .attr("font-size", "11px")
                        .attr("font-weight", "bold")
                        .attr("fill", "#555555")
                        .text(`Exon ${i + 1}`);
                }
            });
        } else {
            g.append("rect")
                .attr("x", rescaledX(0)).attr("y", centerY - (BACKBONE_HEIGHT / 2))
                .attr("width", rescaledX(geneInfo.length) - rescaledX(0)).attr("height", BACKBONE_HEIGHT)
                .attr("rx", 2).attr("fill", bbColor).attr("fill-opacity", 0.6)
                .attr("stroke", BACKBONE_STROKE_COLOR).attr("stroke-width", BACKBONE_STROKE_WIDTH);
        }

        const palette = d3.scaleOrdinal(d3.schemeSet3);
        const variantPalette = d3.scaleOrdinal(CUSTOM_PALETTE_ARRAY).domain(Object.keys(shapeMap));

        // Render Backbone Features (Solid rounded rects, 2/3 height, stacked beneath backbone)
        const activeFeatures = geneInfo.features
            .filter(f => selectedFeatureTypes.has(f.type))
            .sort((a, b) => a.begin - b.begin);
        
        const lanes = [];
        activeFeatures.forEach(f => {
            const startX = rescaledX(f.begin);
            const endX = rescaledX(f.end);
            let laneIdx = lanes.findIndex(end => startX > end + 2); // 2px margin between features
            if (laneIdx === -1) {
                laneIdx = lanes.length;
                lanes.push(endX);
            } else {
                lanes[laneIdx] = Math.max(lanes[laneIdx], endX); // extend lane
            }
            f.lane = laneIdx;
        });

        const featureHeight = BACKBONE_HEIGHT * (2 / 3); 
        const featureMargin = 2;
        const baseFeatureY = centerY + (BACKBONE_HEIGHT / 2) + 4; // Start just below backbone

        activeFeatures.forEach((f, i) => {
            const baseColor = palette(f.type);
            const darkLabelColor = d3.color(baseColor).darker(2.5).toString();
            const fY = baseFeatureY + f.lane * (featureHeight + featureMargin);
            const posLength = f.end - f.begin;
            const isSmallFeature = posLength <= 3;
            const fWidth = Math.max(2, rescaledX(f.end) - rescaledX(f.begin));
            const mid = rescaledX((f.begin + f.end) / 2);

            if (isSmallFeature) {
                g.append("circle")
                    .attr("cx", mid)
                    .attr("cy", fY + featureHeight / 2)
                    .attr("r", featureHeight / 2)
                    .attr("fill", baseColor)
                    .attr("opacity", 1) // Solid color
                    .on("mouseover", (e) => showFeatureTooltip(e, f))
                    .on("mousemove", moveTooltip)
                    .on("mouseout", hideTooltip);
            } else {
                g.append("rect")
                    .attr("x", rescaledX(f.begin))
                    .attr("y", fY)
                    .attr("width", fWidth)
                    .attr("height", featureHeight)
                    .attr("rx", 2)
                    .attr("fill", baseColor)
                    .attr("opacity", 1) // Solid color
                    .on("mouseover", (e) => showFeatureTooltip(e, f))
                    .on("mousemove", moveTooltip)
                    .on("mouseout", hideTooltip);
            }

            if (f.description) {
                const textStr = f.description.substring(0, 32);
                const textWidthApprox = textStr.length * 6.5; // Approx width for 10px Arial

                if (!isSmallFeature && fWidth >= textWidthApprox + 6) {
                    // Draw inside the rectangle
                    g.append("text")
                        .attr("x", mid)
                        .attr("y", fY + featureHeight / 2 + 3.5) // Vertically center
                        .attr("text-anchor", "middle")
                        .attr("font-size", "10px")
                        .attr("font-weight", "bold")
                        .attr("fill", darkLabelColor)
                        .style("pointer-events", "none") // Prevent tooltip block
                        .text(textStr);
                } else {
                    // Draw callout
                    const textStartY = baseFeatureY + lanes.length * (featureHeight + featureMargin) + 15;
                    const labelY = textStartY + (i % 12 * CALLOUT_STAGGER_HEIGHT);
                    
                    g.append("line")
                        .attr("x1", mid)
                        .attr("y1", fY + featureHeight)
                        .attr("x2", mid)
                        .attr("y2", labelY - 8)
                        .attr("stroke", "#d2d2d7")
                        .attr("stroke-width", 0.5);
                    g.append("text")
                        .attr("x", mid)
                        .attr("y", labelY)
                        .attr("text-anchor", "middle")
                        .attr("font-size", CALLOUT_FONT_SIZE)
                        .attr("font-weight", "bold")
                        .attr("fill", darkLabelColor)
                        .text(textStr);
                }
            }
        });

        const lolls = g.selectAll(".v-group").data(visible).enter().append("g");
        const variantLabelData = [];

        lolls.each(function(d) {
            const h = heightMode === 'freq' ? yScale(d.submissions) : -60;
            const match = searching && JSON.stringify(d).toLowerCase().includes(searchInput);
            const op = searching ? (match ? 1 : 0.1) : 1;
            const node = d3.select(this);
            node.append("line").attr("x1", rescaledX(d.pos)).attr("x2", rescaledX(d.pos)).attr("y1", centerY - 10).attr("y2", centerY + h).attr("stroke", match ? PALETTE_COLORS.p1 : "#8e8e93").attr("stroke-width", (match ? 2 : 1)/zoomTransform.k).attr("opacity", op);
            node.append("path").attr("transform", `translate(${rescaledX(d.pos)}, ${centerY + h})`).attr("d", d3.symbol().type(shapeMap[d.type] || d3.symbolCircle).size(LOLLIPOP_HEAD_SIZE)()).attr("fill", getColor(d, variantPalette)).attr("stroke", match ? "black" : "white").attr("stroke-width", match ? 2.5 : 1).attr("opacity", op).style("cursor", "pointer")
                .on("mouseover", (e) => showTooltip(e, d)).on("mousemove", moveTooltip).on("mouseout", hideTooltip).on("click", () => showDetails(d));
            
            const shouldShowLabel = (labelMode === 'all') || (labelMode === 'top' && topNVariantObjs.has(d));
            if (shouldShowLabel && d.hgvs_p && d.hgvs_p !== "N/A" && (!searching || match)) {
                let labelText = d.hgvs_p;
                if (labelText.includes("p.")) {
                    labelText = labelText.split("p.")[1];
                }
                labelText = labelText.replace(/\)$/, '').replace(/^\(/, '');

                variantLabelData.push({
                    text: labelText,
                    x: rescaledX(d.pos),
                    y: centerY + h - (Math.sqrt(LOLLIPOP_HEAD_SIZE)/2) - 4, // start just above symbol
                    color: getColor(d, variantPalette)
                });
            }
        });
        
        // Render and resolve collisions for Variant Labels
        if (labelMode !== 'none' && variantLabelData.length > 0) {
            variantLabelData.sort((a, b) => a.x - b.x); // Sweep left to right
            const placedBoxes = [];
            
            variantLabelData.forEach(lbl => {
                const labelWidth = lbl.text.length * 5.5; // Approx width for 9px font
                const labelHeight = 12;
                let currentY = lbl.y;
                let overlapping = true;
                let sweeps = 0;
                
                // Greedy collision resolution pushing upward
                while (overlapping && sweeps < 50) {
                    overlapping = false;
                    for (let box of placedBoxes) {
                        const pad = 2; // pixel padding
                        if (lbl.x - labelWidth/2 - pad < box.x + box.width/2 + pad &&
                            lbl.x + labelWidth/2 + pad > box.x - box.width/2 - pad &&
                            currentY - labelHeight - pad < box.y &&
                            currentY + pad > box.y - box.height) {
                            overlapping = true;
                            currentY -= 10; // push label up 
                            break;
                        }
                    }
                    sweeps++;
                }
                
                placedBoxes.push({ x: lbl.x, y: currentY, width: labelWidth, height: labelHeight });
                
                const lblGroup = g.append("g").attr("class", "variant-label");
                if (currentY < lbl.y - 2) {
                    lblGroup.append("line")
                        .attr("x1", lbl.x).attr("y1", lbl.y)
                        .attr("x2", lbl.x).attr("y2", currentY + 2)
                        .attr("stroke", "#d2d2d7")
                        .attr("stroke-width", 0.5);
                }
                lblGroup.append("text")
                    .attr("x", lbl.x)
                    .attr("y", currentY)
                    .attr("text-anchor", "middle")
                    .attr("font-size", "9px")
                    .attr("font-family", "Arial, sans-serif")
                    .attr("fill", d3.color(lbl.color).darker(1).toString())
                    .attr("font-weight", "bold")
                    .text(lbl.text);
            });
        }

        updateLegend(baseFilteredData);

        // Render Active Filters Box Overlay directly into the SVG
        const infoBoxWidth = 200;
        const infoGroup = svg.append("g")
            .attr("id", "filter-info-box")
            .attr("transform", `translate(${width - infoBoxWidth - 10}, 10)`);
        
        const formatFilterText = (arr, totalOptions) => {
            if (arr.length === totalOptions || arr.length === 0) return 'All';
            if (arr.length <= 2) return arr.join(', ');
            return `${arr.length} selected`;
        };

        const totalEffects = document.getElementById('effectFilter')?.options.length || 0;
        const totalSigs = document.getElementById('sigFilter')?.options.length || 0;
        const totalConds = document.getElementById('condFilter')?.options.length || 0;

        const filterLines = [
            `Plotted Variants: ${visible.length}`,
            `Effect Filter: ${formatFilterText(effectFilter, totalEffects)}`,
            `Sig Filter: ${formatFilterText(sigFilter, totalSigs)}`,
            `Cond Filter: ${formatFilterText(condFilter, totalConds)}`
        ];

        infoGroup.append("rect")
            .attr("x", 0).attr("y", 0)
            .attr("width", infoBoxWidth).attr("height", filterLines.length * 16 + 15)
            .attr("fill", "#ffffff").attr("stroke", "#e0e0e0").attr("rx", 6).attr("opacity", 0.95);

        filterLines.forEach((line, i) => {
            infoGroup.append("text")
                .attr("x", 12).attr("y", 20 + i * 16)
                .attr("font-size", "11px")
                .attr("font-family", "Arial, sans-serif")
                .attr("fill", "#333333")
                .attr("font-weight", i === 0 ? "bold" : "normal")
                .text(line.length > 35 ? line.substring(0, 32) + '...' : line);
        });
    }

    function getColor(d, palette) {
        const mode = document.getElementById('colorMode')?.value || 'clinvar';
        if (mode === 'type') return palette(d.type);
        if (mode === 'condition') return d.primaryCondition === 'Multiple' ? '#9467bd' : (d.primaryCondition === 'Unknown' ? '#8e8e93' : conditionColorScale(d.primaryCondition));
        const sig = d.significance.toLowerCase();
        if(sig.includes("pathogenic")) return PALETTE_COLORS.p2;
        if(sig.includes("benign")) return PALETTE_COLORS.p1;
        return PALETTE_COLORS.p4;
    }

    function getRel(e) { const w = document.getElementById('viz-wrapper').getBoundingClientRect(); return { x: e.clientX - w.left, y: e.clientY - w.top }; }
    function showTooltip(e, d) { const p = getRel(e); d3.select("#tooltip").style("visibility", "visible").style("left", (p.x + 15) + "px").style("top", (p.y - 10) + "px").html(`<strong>${d.hgvs_p}</strong><br>Sig: ${d.significance}<br>Type: ${d.type}`); }
    function showFeatureTooltip(e, f) { const p = getRel(e); d3.select("#tooltip").style("visibility", "visible").style("left", (p.x + 15) + "px").style("top", (p.y - 10) + "px").html(`<strong>${f.type}</strong>: ${f.description || "N/A"}`); }
    function showExonTooltip(e, s) { const p = getRel(e); d3.select("#tooltip").style("visibility", "visible").style("left", (p.x + 15) + "px").style("top", (p.y - 10) + "px").html(`<strong>Exon Segment</strong><br>Range: ${Math.round(s.start)}-${Math.round(s.end)} aa`); }
    function moveTooltip(e) { const p = getRel(e); d3.select("#tooltip").style("left", (p.x + 15) + "px").style("top", (p.y - 10) + "px"); }
    function hideTooltip() { d3.select("#tooltip").style("visibility", "hidden"); }

    function capitalizeFirstLetter(str) {
      if (str && typeof str === "string") {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }
      return str;
    }

    function showDetails(d) {
        console.log(d)
        const condList = Object.entries(d.condCounts).map(([name, count]) => `${name} [${count}]`).join("<br>");
        const clinvarLink = d.variant_id ? `<a href="https://www.ncbi.nlm.nih.gov/clinvar/variation/${d.variant_id}" target="_blank" style="color:var(--accent); font-weight:bold">${d.variant_id}</a>` : "N/A";
        
        document.getElementById('modalContent').innerHTML = `
            <table class="detail-table">
                <tr><th>Preferred Name</th><td>${d.hgvs_p}</td></tr>
                <tr><th>Other Name(s)</th><td>${d.hgvs_g}</td></tr>
                <tr><th>Submissions</th><td>${d.submissions}</td></tr>
                <tr><th>ClinVar ID</th><td>${clinvarLink}</td></tr>
                <tr><th>Significance</th><td><span class="badge" style="background:${getColor(d, d3.scaleOrdinal(CUSTOM_PALETTE_ARRAY))}">${d.significance}</span></td></tr>
                <tr><th>Top Condition</th><td>${d.primaryCondition}</td></tr>
                <tr><th>All Associated Conditions</th><td>${condList || "None provided"}</td></tr>
                <tr><th>Variant Type</th><td>${capitalizeFirstLetter(d.type)}</td></tr>
            </table>
            <h3>Pretty Print Raw ClinVar Record</h3>
            <div class="raw-json-block"><pre>${JSON.stringify(d.raw, null, 2)}</pre></div>
        `;
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('exportBtn').onclick = () => { 
            const b = new Blob([JSON.stringify(d.raw, null, 2)], { type: 'application/json' }); 
            const u = URL.createObjectURL(b); 
            const l = document.createElement('a'); l.href = u; l.download = `${d.id}.json`; l.click(); 
        };
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function resetZoom() { d3.select("#viz-container").transition().call(zoom.transform, d3.zoomIdentity); }
    
    // --- EXPORT FUNCTIONS ---
    
    function createExportSVG() {
        const vizSvg = document.querySelector("#viz-container svg");
        if (!vizSvg) return null;
        const legendArea = document.getElementById('legend-area');
        const isCollapsed = legendArea.classList.contains('collapsed');
        const legendWidth = isCollapsed ? 0 : 280;
        
        const origWidth = parseFloat(vizSvg.getAttribute('width'));
        const origHeight = parseFloat(vizSvg.getAttribute('height'));
        
        const svgString = new XMLSerializer().serializeToString(vizSvg);
        
        // Build a unified SVG with native elements for exactly matched export
        const ns = "http://www.w3.org/2000/svg";
        const newSvg = document.createElementNS(ns, "svg");
        newSvg.setAttribute("width", origWidth + legendWidth);
        newSvg.setAttribute("height", origHeight);
        newSvg.setAttribute("xmlns", ns);
        
        // Embed global styles to ensure fonts and CSS Variables carry over perfectly
        const style = document.createElementNS(ns, "style");
        style.textContent = `
            :root {
                --bg: #ffffff;
                --card: #ffffff;
                --text: #000000;
                --accent: #28509C;
                --border: #e0e0e0;
                --console-bg: #1c1c1e;
                --console-text: #00ff00;
            }
            * { font-family: Arial, sans-serif; }
            text { font-family: Arial, sans-serif; }
        `;
        newSvg.appendChild(style);

        // Solid background to ensure PNGs and SVGs are never transparent
        const bg = document.createElementNS(ns, "rect");
        bg.setAttribute("width", "100%");
        bg.setAttribute("height", "100%");
        bg.setAttribute("fill", "#ffffff");
        newSvg.appendChild(bg);
        
        // Insert the actual plot, translated to make room for legend if present
        const plotGroup = document.createElementNS(ns, "g");
        plotGroup.setAttribute("transform", `translate(${legendWidth}, 0)`);
        plotGroup.innerHTML = svgString.replace(/<svg[^>]*>/, '').replace(/<\/svg>/, '');
        newSvg.appendChild(plotGroup);
        
        if (!isCollapsed) {
            const legendGroup = document.createElementNS(ns, "g");
            legendGroup.setAttribute("id", "export-legend");
            
            const legBg = document.createElementNS(ns, "rect");
            legBg.setAttribute("width", legendWidth);
            legBg.setAttribute("height", origHeight);
            legBg.setAttribute("fill", "#fafafa");
            legBg.setAttribute("stroke", "#e0e0e0");
            legBg.setAttribute("stroke-width", "1");
            legendGroup.appendChild(legBg);
            
            let lx = 20, ly = 30;
            
            // Reconstruct HTML legend iteratively as native SVG rects, circles and texts
            const sections = legendArea.querySelectorAll('.legend-section');
            sections.forEach(sec => {
                const title = sec.querySelector('.legend-title');
                if (title) {
                    const t = document.createElementNS(ns, "text");
                    t.setAttribute("x", lx);
                    t.setAttribute("y", ly);
                    t.setAttribute("fill", "#86868b");
                    t.setAttribute("font-size", "11px");
                    t.setAttribute("font-weight", "700");
                    t.setAttribute("letter-spacing", "0.05em");
                    t.textContent = title.innerText;
                    legendGroup.appendChild(t);
                    ly += 20;
                }
                
                const items = sec.querySelectorAll('.legend-item');
                items.forEach(item => {
                    const isHidden = item.classList.contains('hidden');
                    const opacity = isHidden ? "0.3" : "1";
                    
                    const circle = item.querySelector('.swatch-circle');
                    const rect = item.querySelector('.swatch-rect');
                    const shape = item.querySelector('.swatch-shape svg path');
                    const span = item.querySelector('span');
                    
                    if (circle) {
                        const bgCol = getComputedStyle(circle).backgroundColor;
                        const c = document.createElementNS(ns, "circle");
                        c.setAttribute("cx", lx + 5);
                        c.setAttribute("cy", ly - 4);
                        c.setAttribute("r", "5");
                        c.setAttribute("fill", bgCol);
                        c.setAttribute("stroke", "rgba(0,0,0,0.1)");
                        c.setAttribute("opacity", opacity);
                        legendGroup.appendChild(c);
                    } else if (rect) {
                        const bgCol = getComputedStyle(rect).backgroundColor;
                        const r = document.createElementNS(ns, "rect");
                        r.setAttribute("x", lx);
                        r.setAttribute("y", ly - 9);
                        r.setAttribute("width", "20");
                        r.setAttribute("height", "10");
                        r.setAttribute("rx", "2");
                        r.setAttribute("fill", bgCol);
                        r.setAttribute("stroke", "rgba(0,0,0,0.1)");
                        r.setAttribute("opacity", opacity);
                        legendGroup.appendChild(r);
                    } else if (shape) {
                        const d = shape.getAttribute('d');
                        const p = document.createElementNS(ns, "path");
                        p.setAttribute("d", d);
                        p.setAttribute("transform", `translate(${lx + 7}, ${ly - 4})`);
                        p.setAttribute("fill", "#636366");
                        p.setAttribute("opacity", opacity);
                        legendGroup.appendChild(p);
                    }
                    
                    if (span) {
                        const t = document.createElementNS(ns, "text");
                        const tx = lx + (rect ? 28 : 20);
                        t.setAttribute("x", tx);
                        t.setAttribute("y", ly);
                        t.setAttribute("fill", "#000000");
                        t.setAttribute("font-size", "11px");
                        t.setAttribute("opacity", opacity);
                        if (isHidden) t.setAttribute("text-decoration", "line-through");
                        t.textContent = span.innerText;
                        legendGroup.appendChild(t);
                    }
                    ly += 22;
                });
                ly += 10;
            });
            newSvg.appendChild(legendGroup);
        }
        
        return newSvg;
    }

    function exportSVG() { 
        const svg = createExportSVG();
        if (!svg) return;
        const s = (new XMLSerializer()).serializeToString(svg); 
        const l = document.createElement("a"); 
        l.href = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s); 
        l.download = "QuickLolli_Export.svg"; 
        l.click(); 
    }

    function exportPNG() {
        const svg = createExportSVG();
        if (!svg) return;
        const s = (new XMLSerializer()).serializeToString(svg);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        
        // Use higher resolution multiplier for sharper PNG
        const resMultiplier = window.devicePixelRatio || 2;
        canvas.width = parseFloat(svg.getAttribute("width")) * resMultiplier;
        canvas.height = parseFloat(svg.getAttribute("height")) * resMultiplier;

        img.onload = function() {
            ctx.scale(resMultiplier, resMultiplier);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            const l = document.createElement("a");
            l.href = canvas.toDataURL("image/png");
            l.download = "QuickLolli_Export.png";
            l.click();
        };
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
    }

    // Helpers for extracting accurate colors & PPT shape types
    function cssColorToHex(colorStr) {
        if (!colorStr || colorStr === 'none') return null;
        if (colorStr.startsWith('var(')) {
            const varName = colorStr.match(/var\((.*?)\)/)[1].trim();
            colorStr = getComputedStyle(document.body).getPropertyValue(varName).trim();
        }
        const div = document.createElement('div');
        div.style.color = colorStr;
        document.body.appendChild(div);
        const rgb = getComputedStyle(div).color;
        document.body.removeChild(div);
        
        const match = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (match) {
            const r = parseInt(match[1]).toString(16).padStart(2, '0');
            const g = parseInt(match[2]).toString(16).padStart(2, '0');
            const b = parseInt(match[3]).toString(16).padStart(2, '0');
            return (r + g + b).toUpperCase();
        }
        if (colorStr.startsWith('#')) return colorStr.substring(1, 7).toUpperCase();
        return '000000';
    }

    function getShapeTypeFromD(d, pres) {
        if (!d) return pres.shapes.OVAL;
        if (d.includes('A')) return pres.shapes.OVAL;
        let points = (d.match(/[MLZ]/gi) || []).length;
        if (points <= 4) return pres.shapes.TRIANGLE;
        if (points === 5) {
            if (d.startsWith('M0,-')) return pres.shapes.DIAMOND;
            return pres.shapes.RECTANGLE;
        }
        if (points >= 10 && points <= 11) return pres.shapes.STAR_5_POINT;
        if (points >= 12) return pres.shapes.CROSS;
        return pres.shapes.OVAL;
    }

    function exportPPTX() {
        const svg = createExportSVG();
        if (!svg) return;

        const pres = new PptxGenJS();
        pres.layout = 'LAYOUT_WIDE'; // Standard Widescreen (13.33 x 7.5 inches)
        const slide = pres.addSlide();
        
        const svgW = parseFloat(svg.getAttribute('width'));
        const svgH = parseFloat(svg.getAttribute('height'));
        
        // Setup coordinates & boundaries to fit comfortably inside the PPTX slide
        const maxW = 12.33, maxH = 6.5; 
        const scale = Math.min(maxW / (svgW / 96), maxH / (svgH / 96));
        const xOff = (13.33 - (svgW / 96) * scale) / 2;
        const yOff = (7.5 - (svgH / 96) * scale) / 2;
        
        const ptX = (x) => xOff + (x / 96) * scale;
        const ptY = (y) => yOff + (y / 96) * scale;
        const ptS = (s) => (s / 96) * scale;

        // Recursively convert SVG nodes to PptxGenJS editable Shapes
        function parseNode(node, tx, ty, groupOpacity) {
            if (node.nodeType !== 1) return;
            
            let nTx = tx, nTy = ty;
            const transform = node.getAttribute('transform');
            if (transform && transform.includes('translate')) {
                const match = transform.match(/translate\(([-\d.]+)(?:,\s*([-\d.]+))?\)/);
                if (match) {
                    nTx += parseFloat(match[1] || 0);
                    nTy += parseFloat(match[2] || 0);
                }
            }
            
            const nodeOpacity = parseFloat(node.getAttribute('opacity') || 1) * groupOpacity;
            const transparency = Math.round((1 - nodeOpacity) * 100);
            
            const fillRaw = node.getAttribute('fill') || node.style?.fill;
            const strokeRaw = node.getAttribute('stroke') || node.style?.stroke;
            const fill = cssColorToHex(fillRaw);
            const lineCol = cssColorToHex(strokeRaw);
            const sw = parseFloat(node.getAttribute('stroke-width') || 1) * 0.75 * scale;
            
            const tag = node.tagName.toLowerCase();
            
            if (tag === 'rect') {
                const x = parseFloat(node.getAttribute('x') || 0) + nTx;
                const y = parseFloat(node.getAttribute('y') || 0) + nTy;
                const w = parseFloat(node.getAttribute('width') || 0);
                const h = parseFloat(node.getAttribute('height') || 0);
                if (w > 0 && h > 0 && fill !== 'FAFAFA') { // Skip background legend rect explicitly or it blocks clicks
                    let opts = { x: ptX(x), y: ptY(y), w: ptS(w), h: ptS(h) };
                    if (fill && fill !== 'none') opts.fill = { color: fill, transparency };
                    if (lineCol && lineCol !== 'NONE' && lineCol !== 'none') opts.line = { color: lineCol, transparency, width: sw };
                    slide.addShape(pres.shapes.RECTANGLE, opts);
                }
            }
            else if (tag === 'circle') {
                const cx = parseFloat(node.getAttribute('cx') || 0) + nTx;
                const cy = parseFloat(node.getAttribute('cy') || 0) + nTy;
                const r = parseFloat(node.getAttribute('r') || 0);
                if (r > 0) {
                    let opts = { x: ptX(cx - r), y: ptY(cy - r), w: ptS(r * 2), h: ptS(r * 2) };
                    if (fill && fill !== 'none') opts.fill = { color: fill, transparency };
                    if (lineCol && lineCol !== 'NONE' && lineCol !== 'none') opts.line = { color: lineCol, transparency, width: sw };
                    slide.addShape(pres.shapes.OVAL, opts);
                }
            }
            else if (tag === 'line') {
                const x1 = parseFloat(node.getAttribute('x1') || 0) + nTx;
                const y1 = parseFloat(node.getAttribute('y1') || 0) + nTy;
                const x2 = parseFloat(node.getAttribute('x2') || 0) + nTx;
                const y2 = parseFloat(node.getAttribute('y2') || 0) + nTy;
                const origSw = parseFloat(node.getAttribute('stroke-width') || 1);
                
                // Represent straight SVG lines as thin rectangles in PPT for reliable sizing & positioning
                if (Math.abs(x1 - x2) < 0.1) {
                    let opts = { x: ptX(x1 - origSw/2), y: ptY(Math.min(y1, y2)), w: ptS(origSw), h: ptS(Math.abs(y2 - y1)) };
                    if (lineCol && lineCol !== 'none') opts.fill = { color: lineCol, transparency };
                    slide.addShape(pres.shapes.RECTANGLE, opts);
                } else if (Math.abs(y1 - y2) < 0.1) {
                    let opts = { x: ptX(Math.min(x1, x2)), y: ptY(y1 - origSw/2), w: ptS(Math.abs(x2 - x1)), h: ptS(origSw) };
                    if (lineCol && lineCol !== 'none') opts.fill = { color: lineCol, transparency };
                    slide.addShape(pres.shapes.RECTANGLE, opts);
                }
            }
            else if (tag === 'path') {
                const d = node.getAttribute('d');
                const shape = getShapeTypeFromD(d, pres);
                const w = 12, h = 12; // Mapped size constraints corresponding directly to d3 size(80) 
                let opts = { x: ptX(nTx - w/2), y: ptY(nTy - h/2), w: ptS(w), h: ptS(h) };
                if (fill && fill !== 'none') opts.fill = { color: fill, transparency };
                if (lineCol && lineCol !== 'NONE' && lineCol !== 'FFFFFF' && lineCol !== 'none') opts.line = { color: lineCol, transparency, width: sw };
                slide.addShape(shape, opts);
            }
            else if (tag === 'text') {
                const x = parseFloat(node.getAttribute('x') || 0) + nTx;
                const y = parseFloat(node.getAttribute('y') || 0) + nTy;
                const anchor = node.getAttribute('text-anchor');
                const fsStr = node.getAttribute('font-size') || '12px';
                const fs = parseFloat(fsStr);
                const isBold = node.getAttribute('font-weight') === '700' || node.getAttribute('font-weight') === '800' || node.getAttribute('font-weight') === 'bold';
                
                const tspans = node.querySelectorAll('tspan');
                if (tspans.length > 0) {
                    let currentY = y;
                    tspans.forEach(ts => {
                        let tX = ts.hasAttribute('x') ? parseFloat(ts.getAttribute('x')) + nTx : x;
                        let tDy = ts.getAttribute('dy');
                        let tFs = parseFloat(ts.getAttribute('font-size') || fsStr);
                        let tBold = ts.getAttribute('font-weight') === '700' || ts.getAttribute('font-weight') === '800' || ts.getAttribute('font-weight') === 'bold' || isBold;
                        let tColor = cssColorToHex(ts.getAttribute('fill')) || fill || '000000';
                        
                        if (tDy && tDy.includes('em')) currentY += parseFloat(tDy) * tFs;
                        else if (tDy) currentY += parseFloat(tDy);
                        
                        let align = 'left', pX = ptX(tX);
                        if (anchor === 'middle') { align = 'center'; pX = ptX(tX) - ptS(1000)/2; }
                        
                        slide.addText(ts.textContent, {
                            x: pX, y: ptY(currentY - tFs * 0.8), w: anchor === 'middle' ? ptS(1000) : ptS(300), h: ptS(tFs * 1.5),
                            fontSize: tFs * 0.75 * scale, color: tColor, bold: tBold, align, transparency, fontFace: "Arial"
                        });
                    });
                } else {
                    let align = 'left', pX = ptX(x);
                    if (anchor === 'middle') { align = 'center'; pX = ptX(x) - ptS(1000)/2; }
                    const isStrikethrough = node.getAttribute('text-decoration') === 'line-through';
                    
                    slide.addText(node.textContent, {
                        x: pX, y: ptY(y - fs * 0.8), w: anchor === 'middle' ? ptS(1000) : ptS(300), h: ptS(fs * 1.5),
                        fontSize: fs * 0.75 * scale, color: fill || '000000', bold: isBold, align, transparency, strike: isStrikethrough, fontFace: "Arial"
                    });
                }
            }
            
            if (tag === 'g' || tag === 'svg') {
                Array.from(node.childNodes).forEach(child => parseNode(child, nTx, nTy, nodeOpacity));
            }
        }
        
        parseNode(svg, 0, 0, 1);
        pres.writeFile({ fileName: "QuickLolli_Export.pptx" });
    }
    
    function toggleFeatureType(cb) {
        cb.checked ? selectedFeatureTypes.add(cb.value) : selectedFeatureTypes.delete(cb.value);
        render();
    }

    window.addEventListener('DOMContentLoaded', () => {
        handleScreenResize(mediaQuery); // Set initial state based on size
        const urlParams = new URLSearchParams(window.location.search);
        const geneParam = urlParams.get('gene');
        if (geneParam) {
            const input = document.getElementById('geneSearch');
            if (input) {
                input.value = geneParam.toUpperCase();
                loadGeneData();
            }
        }
    });
